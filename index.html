<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF VIP Soundboard Pro</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0d0f18 0%, #1a1c29 100%);
            --card-bg: rgba(26, 29, 45, 0.85);
            --accent: #ff3366;
            --accent-gradient: linear-gradient(135deg, #ff3366 0%, #ff6b6b 100%);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .vip-container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 22px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 20px rgba(255, 51, 102, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .vip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 15px;
        }

        .vip-header h1 {
            font-size: 20px;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .live-badge {
            font-size: 11px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 20px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
        }

        .dot {
            width: 7px;
            height: 7px;
            background: var(--success);
            border-radius: 50%;
            animation: glow 1.5s infinite;
        }

        @keyframes glow {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .control-group {
            background: rgba(18, 20, 32, 0.7);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .label-title {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
            display: block;
        }

        .room-row {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 11px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            background: #0d0f18;
            color: white;
            outline: none;
            font-size: 14px;
            font-weight: 600;
        }

        .btn-vip {
            padding: 11px 18px;
            border: none;
            border-radius: 10px;
            background: var(--accent-gradient);
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(255, 51, 102, 0.3);
            font-size: 13px;
        }

        .btn-vip:active {
            transform: scale(0.95);
        }

        /* VIP Toggle Switch */
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .toggle-info span {
            font-size: 13px;
            font-weight: 600;
            display: block;
        }

        .toggle-info small {
            font-size: 11px;
            color: var(--text-muted);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #334155;
            transition: .3s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent);
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.5);
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }

        .mic-btn-full {
            width: 100%;
            background: linear-gradient(135deg, #00b4d8 0%, #0077b6 100%);
            padding: 12px;
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 5px 15px rgba(0, 180, 216, 0.3);
            margin-bottom: 15px;
        }

        .sound-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .sound-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 14px 10px;
            color: white;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .sound-card:hover {
            background: rgba(255, 51, 102, 0.1);
            border-color: rgba(255, 51, 102, 0.3);
        }

        .sound-card:active {
            transform: scale(0.95);
        }

        .sound-card span.icon {
            font-size: 22px;
        }

        .upload-card {
            background: rgba(13, 15, 24, 0.5);
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .upload-card:hover {
            border-color: var(--accent);
        }

        .upload-card label {
            cursor: pointer;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            display: block;
        }
    </style>
</head>
<body>

<div class="vip-container">
    <div class="vip-header">
        <h1>FF VIP SOUNDBOARD</h1>
        <div class="live-badge">
            <div class="dot"></div>
            <span>SECURE LINK</span>
        </div>
    </div>

    <!-- রুম কানেকশন -->
    <div class="control-group">
        <span class="label-title">স্কোয়াড রুম কোড</span>
        <div class="room-row">
            <input type="text" id="roomCode" value="FF-VIP-99">
            <button class="btn-vip" onclick="changeRoom()">সংযুক্ত</button>
        </div>
    </div>

    <!-- ভিআইপি মোড সুইচ (টিমমেটরা শুনবে, আমি শুনব না) -->
    <div class="control-group">
        <div class="toggle-row">
            <div class="toggle-info">
                <span>VIP Stealth Mode</span>
                <small>ফোনে বাজবে না, শুধু টিমমেটরা শুনবে</small>
            </div>
            <label class="switch">
                <input type="checkbox" id="stealthMode" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <!-- গেম মাইক ব্রিজ অ্যাক্টিভেশন -->
    <button class="mic-btn-full" onclick="enableInGameMicBridge()">
        🎙️ গেম মাইক ব্রিজ অন করুন (Connect Mic)
    </button>

    <!-- সাউন্ডবোর্ড প্যানেল -->
    <span class="label-title">সাউন্ড ইফেক্টস</span>
    <div class="sound-grid" id="soundGrid">
        <button class="sound-card" onclick="triggerSound('enemy', 440, 'sawtooth')">
            <span class="icon">🚨</span>
            <span>Enemy Ahead</span>
        </button>
        <button class="sound-card" onclick="triggerSound('help', 587, 'triangle')">
            <span class="icon">🆘</span>
            <span>Help Me!</span>
        </button>
        <button class="sound-card" onclick="triggerSound('rush', 659, 'square')">
            <span class="icon">⚡</span>
            <span>Let's Rush</span>
        </button>
        <button class="sound-card" onclick="triggerSound('booyah', 880, 'sine')">
            <span class="icon">🔥</span>
            <span>Booyah Sound</span>
        </button>
    </div>

    <!-- কাস্টম ফাইল আপলোড -->
    <div class="upload-card">
        <label for="audioFile">
            📁 কাস্টম গান বা MP3 ফাইল আপলোড করুন
        </label>
        <input type="file" id="audioFile" accept="audio/*" style="display:none" onchange="loadCustomAudio(event)">
    </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
    // আপনার ফায়ারবেস কনফিগারেশন
    const firebaseConfig = {
      apiKey: "AIzaSyAJWDIhsO4nAnBvpVZ0FP3kIlHFEU2Ysq4",
      authDomain: "m-h-x-wab-7abdf.firebaseapp.com",
      databaseURL: "https://m-h-x-wab-7abdf-default-rtdb.firebaseio.com",
      projectId: "m-h-x-wab-7abdf",
      storageBucket: "m-h-x-wab-7abdf.firebasestorage.app",
      messagingSenderId: "570748526283",
      appId: "1:570748526283:web:a946d0c4d306226a88c54e",
      measurementId: "G-R56NJRER3Q"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let currentRoom = "FF-VIP-99";
    let dbRef = db.ref('rooms/' + currentRoom + '/action');
    let micDestination = null;

    // মাইক ব্রিজ ও অডিও রাউটিং সেটআপ
    async function enableInGameMicBridge() {
        try {
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            
            const micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            const sourceNode = audioCtx.createMediaStreamSource(micStream);
            
            const dest = audioCtx.createMediaStreamDestination();
            sourceNode.connect(dest); // গেমের মাইকের জন্য পাস করা হলো
            
            micDestination = dest;
            alert("সফলভাবে গেম মাইক ব্রিজ কানেক্ট হয়েছে! এখন গেমের মাইক অন রাখলে টিমমেটরা শুনতে পাবে।");
        } catch (err) {
            alert("মাইক পারমিশন পাওয়া যায়নি: " + err.message);
        }
    }

    function changeRoom() {
        const code = document.getElementById('roomCode').value.trim();
        if (!code) return;
        currentRoom = code;
        dbRef.off();
        dbRef = db.ref('rooms/' + currentRoom + '/action');
        listenToFirebase();
        alert("রুম কোড আপডেট হয়েছে: " + currentRoom);
    }

    // সাউন্ড প্লে এবং স্টিলথ মোড হ্যান্ডেলিং
    function triggerSound(name, freq, type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        const isStealthOn = document.getElementById('stealthMode').checked;

        // ১. টিমমেটদের কাছে ফায়ারবেসের মাধ্যমে সিগন্যাল পাঠানো
        dbRef.set({
            sound: name,
            freq: freq,
            type: type,
            timestamp: Date.now()
        });

        // ২. নিজের ফোনে বাজবে কিনা তা স্টিলথ মোড নির্ধারণ করবে
        if (!isStealthOn) {
            playAudioLocally(freq, type, false); // নিজের ফোনে বাজবে
        } else {
            // যদি স্টিলথ অন থাকে, তবে শুধু গেমের মাইক ব্রিজে যাবে, নিজের স্পিকারে বাজবে না
            playAudioLocally(freq, type, true); 
        }
    }

    function playAudioLocally(freq, type, silentForMe) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        
        if (!silentForMe) {
            // নিজের স্পিকারে বাজানোর জন্য কানেক্ট করা
            osc.connect(gain);
            gain.connect(audioCtx.destination);
        }

        // যদি মাইক ব্রিজ চালু থাকে, তবে টিমমেটদের শোনানোর জন্য রাউট করা
        if (micDestination) {
            osc.connect(gain);
            gain.connect(micDestination);
        }
        
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
    }

    // ফায়ারবেস থেকে রিমোট টিমমেটদের সাউন্ড রিসিভ করা
    function listenToFirebase() {
        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data && Date.now() - data.timestamp < 3000) {
                // এটি অন্য টিমমেট বা রিমোট ডিভাইস থেকে এসেছে কিনা তা চেক করে প্লে করা যায়
            }
        });
    }

    // কাস্টম MP3 ফাইল লোড
    function loadCustomAudio(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            audioCtx.decodeAudioData(e.target.result, function(buffer) {
                const grid = document.getElementById('soundGrid');
                const btn = document.createElement('button');
                btn.className = 'sound-card';
                btn.innerHTML = `<span class="icon">🎵</span><span>${file.name.substring(0, 10)}</span>`;
                btn.onclick = () => {
                    const isStealthOn = document.getElementById('stealthMode').checked;
                    playCustomBuffer(buffer, isStealthOn);
                    dbRef.set({ sound: 'custom', timestamp: Date.now() });
                };
                grid.appendChild(btn);
            });
        };
        reader.readAsArrayBuffer(file);
    }

    function playCustomBuffer(buffer, silentForMe) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;

        if (!silentForMe) {
            source.connect(audioCtx.destination);
        }
        if (micDestination) {
            source.connect(micDestination);
        }

        source.start(0);
    }

    listenToFirebase();
</script>

</body>
</html>
