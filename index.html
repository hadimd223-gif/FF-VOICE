<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Voice & In-Game Soundboard</title>
    <style>
        :root {
            --bg-dark: #0f111a;
            --card-bg: #1a1d2d;
            --accent: #ff4655;
            --accent-hover: #e03a48;
            --text-main: #ffffff;
            --text-muted: #8f95b2;
            --success: #00e676;
            --warning: #ff9800;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .header h1 {
            font-size: 18px;
            letter-spacing: 1px;
            color: var(--accent);
        }

        .status-badge {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 20px;
            background: rgba(0, 230, 118, 0.15);
            color: var(--success);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .room-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.15);
            background: #121420;
            color: white;
            outline: none;
            font-size: 14px;
        }

        button.primary-btn {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
        }

        button.primary-btn:hover {
            background: var(--accent-hover);
        }

        .section-title {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        /* ইন-গেম মাইক রাউটার প্যানেল */
        .mic-routing-box {
            background: #121420;
            border: 1px solid rgba(255, 152, 0, 0.3);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
            text-align: center;
        }

        .mic-routing-box p {
            font-size: 12px;
            color: var(--warning);
            margin-bottom: 8px;
        }

        .sound-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .sound-btn {
            background: #23273d;
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 12px 8px;
            color: white;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .sound-btn:active {
            transform: scale(0.96);
            background: var(--accent);
        }

        .sound-btn span.icon {
            font-size: 20px;
        }

        .custom-upload {
            background: #121420;
            border: 1px dashed rgba(255,255,255,0.2);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            margin-bottom: 12px;
        }

        .custom-upload label {
            cursor: pointer;
            color: var(--text-muted);
            font-size: 12px;
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>FF IN-GAME SOUNDBOARD</h1>
        <div class="status-badge">
            <div class="status-dot"></div>
            <span id="connStatus">Online</span>
        </div>
    </div>

    <!-- টিম রুম সিঙ্ক -->
    <div class="section-title">টিম রুম কোড</div>
    <div class="room-controls">
        <input type="text" id="roomCode" value="FF77">
        <button class="primary-btn" onclick="changeRoom()">সংযুক্ত হন</button>
    </div>

    <!-- ইন-গেম মাইক ব্রিজ অপশন -->
    <div class="mic-routing-box">
        <p>⚠️ গেমের ভেতর সাউন্ড শোনাতে মাইক পারমিশন অন রাখুন</p>
        <button class="primary-btn" style="background: #00bcd4; width: 100%; font-size: 13px;" onclick="enableInGameMicBridge()">🎙️ গেম মাইক ব্রিজ স্টার্ট করুন</button>
    </div>

    <!-- সাউন্ডবোর্ড বাটনসমূহ -->
    <div class="section-title">সাউন্ড ইফেক্ট</div>
    <div class="sound-grid" id="soundGrid">
        <button class="sound-btn" onclick="triggerSound('enemy', 440, 'sawtooth')">
            <span class="icon">🚨</span>
            <span>Enemy Ahead!</span>
        </button>
        <button class="sound-btn" onclick="triggerSound('help', 587, 'triangle')">
            <span class="icon">🆘</span>
            <span>Help Me!</span>
        </button>
        <button class="sound-btn" onclick="triggerSound('rush', 659, 'square')">
            <span class="icon">⚡</span>
            <span>Let's Rush!</span>
        </button>
        <button class="sound-btn" onclick="triggerSound('booyah', 880, 'sine')">
            <span class="icon">🔥</span>
            <span>Booyah!</span>
        </button>
    </div>

    <!-- কাস্টম অডিও আপলোড -->
    <div class="custom-upload">
        <label for="audioFile">
            📁 গান বা কাস্টম MP3 সাউন্ড যোগ করুন
        </label>
        <input type="file" id="audioFile" accept="audio/*" style="display:none" onchange="loadCustomAudio(event)">
    </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
    // আপনার ফায়ারবেস কনফিগারেশন
    const firebaseConfig = {
      apiKey: "AIzaSyAJWDIhsO4nAnBvpVZ0FP3kIlHFEU2Ysq4",
      authDomain: "m-h-x-wab-7abdf.firebaseapp.com",
      databaseURL: "https://m-h-x-wab-7abdf-default-rtdb.firebaseio.com",
      projectId: "m-h-x-wab-7abdf",
      storageBucket: "m-h-x-wab-7abdf.firebasestorage.app",
      messagingSenderId: "570748526283",
      appId: "1:570748526283:web:a946d0c4d306226a88c54e",
      measurementId: "G-R56NJRER3Q"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let currentRoom = "FF77";
    let dbRef = db.ref('rooms/' + currentRoom + '/action');
    let destinationStream = null;

    // গেমের ইন-গেম মাইকের সাথে অডিও কানেক্ট করার ব্রিজ
    async function enableInGameMicBridge() {
        try {
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            
            // মাইক্রোফোন পারমিশন নেওয়া এবং অডিও স্ট্রিম তৈরি করা
            const micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            const sourceNode = audioCtx.createMediaStreamSource(micStream);
            
            // ডেস্টিনেশন নোড যা অডিও আউটপুটকে ইনপুটে রূপান্তর করবে
            const dest = audioCtx.createMediaStreamDestination();
            sourceNode.connect(dest);
            
            destinationStream = dest.stream;
            alert("সফলভাবে মাইক ব্রিজ কানেক্ট হয়েছে! এখন ফ্রি ফায়ার গেমের গ্রুপে মাইক অন করলে এই সাউন্ডগুলো টিমমেটরাও শুনতে পাবে।");
        } catch (err) {
            alert("মাইক পারমিশন পাওয়া যায়নি বা ব্রাউজার ব্লক করেছে: " + err.message);
        }
    }

    function changeRoom() {
        const code = document.getElementById('roomCode').value.trim();
        if (!code) return;
        currentRoom = code;
        dbRef.off();
        dbRef = db.ref('rooms/' + currentRoom + '/action');
        listenToFirebase();
        alert("রুম পরিবর্তন হয়েছে: " + currentRoom);
    }

    function triggerSound(name, freq, type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        playAudioTone(freq, type);

        // ফায়ারবেসে সিগন্যাল পাঠানো যাতে রিমোট টিমমেটরাও শুনতে পায়
        dbRef.set({
            sound: name,
            freq: freq,
            type: type,
            timestamp: Date.now()
        });
    }

    function playAudioTone(freq, type) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        // যদি মাইক ব্রিজ চালু থাকে, তবে সাউন্ডটি গেমের চ্যানেলেও পাস হবে
        if (destinationStream) {
            const destNode = audioCtx.createMediaStreamDestination();
            gain.connect(destNode);
        }
        
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
    }

    function listenToFirebase() {
        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data && Date.now() - data.timestamp < 3000) {
                playAudioTone(data.freq, data.type);
            }
        });
    }

    function loadCustomAudio(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            audioCtx.decodeAudioData(e.target.result, function(buffer) {
                const grid = document.getElementById('soundGrid');
                const btn = document.createElement('button');
                btn.className = 'sound-btn';
                btn.innerHTML = `<span class="icon">🎵</span><span>${file.name.substring(0, 10)}</span>`;
                btn.onclick = () => {
                    playCustomBuffer(buffer);
                    dbRef.set({ sound: 'custom', timestamp: Date.now() });
                };
                grid.appendChild(btn);
            });
        };
        reader.readAsArrayBuffer(file);
    }

    function playCustomBuffer(buffer) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(audioCtx.destination);
        source.start(0);
    }

    listenToFirebase();
</script>

</body>
</html>
