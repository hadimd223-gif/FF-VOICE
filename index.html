<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M H X VOICE WEB // SYSTEM</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #030712;
            --card-bg: rgba(5, 15, 25, 0.95);
            --neon-green: #00ff66;
            --neon-red: #ff003c;
            --green-glow: rgba(0, 255, 102, 0.3);
            --red-glow: rgba(255, 0, 60, 0.3);
            --text-main: #e2e8f0;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Share Tech Mono', monospace;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(rgba(0, 255, 102, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 102, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .hacker-container {
            width: 100%;
            max-width: 460px;
            background: var(--card-bg);
            border: 2px solid var(--neon-green);
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 0 25px var(--green-glow), inset 0 0 15px rgba(0, 255, 102, 0.05);
            position: relative;
            overflow: hidden;
        }

        .terminal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px dashed var(--neon-green);
            padding-bottom: 10px;
        }

        .terminal-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 900;
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green);
            letter-spacing: 1px;
        }

        .system-status {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 4px;
            background: rgba(0, 255, 102, 0.1);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
        }

        .control-panel {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--neon-green);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 12px;
        }

        .label-title {
            font-size: 11px;
            color: var(--neon-green);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
            display: block;
            font-weight: 600;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        input[type="text"], textarea, select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--neon-green);
            background: #000;
            color: var(--neon-green);
            outline: none;
            font-size: 13px;
            font-family: 'Share Tech Mono', monospace;
            box-shadow: inset 0 0 8px var(--green-glow);
        }

        textarea {
            height: 55px;
            resize: none;
            margin-bottom: 8px;
        }

        .btn-cyber {
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            background: var(--neon-green);
            color: #030712;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 10px var(--green-glow);
            font-size: 11px;
        }

        .btn-cyber:hover {
            background: #fff;
        }

        .btn-red {
            background: var(--neon-red);
            color: #fff;
            box-shadow: 0 0 10px var(--red-glow);
        }

        .tts-box {
            background: rgba(0, 255, 102, 0.03);
            border: 1px solid var(--neon-green);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .btn-row {
            display: flex;
            gap: 8px;
        }

        /* চতুর্ভুজাকার ইম্পোর্ট ভয়েস বক্স (সিরিয়াল লিস্ট সহ) */
        .import-section-box {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid var(--neon-green);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
            box-shadow: inset 0 0 10px rgba(0,255,102,0.1);
        }

        .import-drop-zone {
            border: 2px dashed var(--neon-green);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 10px;
        }

        .import-drop-zone:hover {
            background: rgba(0, 255, 102, 0.1);
        }

        .import-drop-zone label {
            cursor: pointer;
            color: var(--neon-green);
            font-size: 11px;
            display: block;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .audio-list-container {
            max-height: 130px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .audio-item-box {
            background: #050d14;
            border: 1px solid var(--neon-green);
            border-radius: 6px;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            cursor: grab;
            transition: 0.2s;
        }

        .audio-item-box:active {
            cursor: grabbing;
        }

        .audio-item-box.active-playing {
            border-color: var(--neon-red);
            background: rgba(255, 0, 60, 0.2);
            color: var(--neon-red);
            box-shadow: 0 0 12px var(--neon-red);
        }

        .audio-info {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
        }

        .audio-actions {
            display: flex;
            gap: 6px;
        }

        .action-icon {
            cursor: pointer;
            font-size: 12px;
            padding: 2px 4px;
        }

        /* ড্র্যাগ করে নিচে ফেলার ডিলিট জোন */
        .trash-drop-zone {
            display: none;
            background: rgba(255, 0, 60, 0.2);
            border: 2px dashed var(--neon-red);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            color: var(--neon-red);
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 10px;
            animation: pulse-trash 1s infinite alternate;
        }

        @keyframes pulse-trash {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        /* টগল সুইচ */
        .toggle-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .toggle-info span {
            font-size: 12px;
            font-weight: bold;
            color: var(--neon-red);
            text-shadow: 0 0 8px var(--neon-red);
            display: block;
        }

        .toggle-info small {
            font-size: 9px;
            color: var(--text-muted);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #1a0005;
            border: 1px solid var(--neon-red);
            transition: .3s;
            border-radius: 4px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: var(--neon-red);
            transition: .3s;
            border-radius: 2px;
        }

        input:checked + .slider {
            background-color: #001a0a;
            border-color: var(--neon-green);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
            background-color: var(--neon-green);
        }

        .mic-btn {
            width: 100%;
            background: linear-gradient(135deg, #ff003c 0%, #990024 100%);
            padding: 10px;
            border: 1px solid var(--neon-red);
            border-radius: 6px;
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 11px;
            cursor: pointer;
            box-shadow: 0 0 12px var(--red-glow);
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

<div class="hacker-container">
    <div class="terminal-header">
        <h1>M H X VOICE WEB</h1>
        <div class="system-status">ACTIVE</div>
    </div>

    <!-- রুম কোড প্যানেল -->
    <div class="control-panel">
        <span class="label-title">> TARGET_ROOM_ID</span>
        <div class="input-row">
            <input type="text" id="roomCode" value="M-H-X-01">
            <button class="btn-cyber" onclick="changeRoom()">CONNECT</button>
        </div>
    </div>

    <!-- ভিআইপি স্টিলথ মোড -->
    <div class="control-panel">
        <div class="toggle-row toggle-box">
            <div class="toggle-info">
                <span>STEALTH BYPASS</span>
                <small>Local: Muted | Squad: Active</small>
            </div>
            <label class="switch">
                <input type="checkbox" id="stealthMode" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <!-- গেম মাইক ব্রিজ -->
    <button class="mic-btn" onclick="enableInGameMicBridge()">
        ⚡ ACTIVATE MIC INJECTION [ROOT]
    </button>

    <!-- চতুর্ভুজাকার ইম্পোর্ট ভয়েস বক্স এবং সিরিয়াল লিস্ট -->
    <div class="import-section-box">
        <span class="label-title">> IMPORTED AUDIO MODULE</span>
        
        <!-- ডিলিট ড্রপ জোন (লং প্রেস করে নিচে টানলে শো করবে) -->
        <div id="trashZone" class="trash-drop-zone">
            🗑️ ডিলিট করতে এখানে এনে ছাড়ুন
        </div>

        <div class="import-drop-zone">
            <label for="audioFileInput">
                📁 [+ নতুন ভয়েস/মিউজিক ইম্পোর্ট করুন]
            </label>
            <input type="file" id="audioFileInput" accept="audio/*" style="display:none" onchange="importAudioFile(event)">
        </div>

        <div class="label-title" style="font-size: 10px; margin-top: 6px;">> AUDIO LIST (১, ২, ৩ সিরিয়াল):</div>
        <div class="audio-list-container" id="audioListContainer">
            <!-- জাভাস্ক্রিপ্ট দিয়ে সিরিয়াল অনুযায়ী বক্সগুলো এখানে আসবে -->
        </div>
    </div>

    <!-- টেক্সট-টু-স্পিচ প্যানেল -->
    <div class="tts-box">
        <span class="label-title">> NATIVE TEXT-TO-SPEECH</span>
        <select id="langSelect" style="margin-bottom: 8px;">
            <option value="bn-BD">বাংলা (Bangla)</option>
            <option value="en-US">English (US)</option>
        </select>
        <textarea id="ttsInput" placeholder="এখানে টেক্সট লিখুন..."></textarea>
        
        <div class="btn-row">
            <button class="btn-cyber btn-red" style="flex:1;" onclick="saveTextPreset()">💾 সেভ করুন</button>
            <button class="btn-cyber" style="flex:1;" onclick="speakAndSendText()">🚀 সেন্ড করুন</button>
        </div>
        
        <div class="saved-presets-container" id="presetsList" style="margin-top: 8px; max-height:80px; overflow-y:auto;"></div>
    </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyAJWDIhsO4nAnBvpVZ0FP3kIlHFEU2Ysq4",
      authDomain: "m-h-x-wab-7abdf.firebaseapp.com",
      databaseURL: "https://m-h-x-wab-7abdf-default-rtdb.firebaseio.com",
      projectId: "m-h-x-wab-7abdf",
      storageBucket: "m-h-x-wab-7abdf.firebasestorage.app",
      messagingSenderId: "570748526283",
      appId: "1:570748526283:web:a946d0c4d306226a88c54e",
      measurementId: "G-R56NJRER3Q"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let currentRoom = "M-H-X-01";
    let dbRef = db.ref('rooms/' + currentRoom + '/action');
    let micDestination = null;
    let activeAudio = null;
    let activeItemIndex = null;

    window.onload = function() {
        loadAudioList();
        loadPresets();
    };

    async function enableInGameMicBridge() {
        try {
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            const micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            const sourceNode = audioCtx.createMediaStreamSource(micStream);
            const dest = audioCtx.createMediaStreamDestination();
            sourceNode.connect(dest);
            micDestination = dest;
            alert("[SUCCESS] Mic injection protocol initialized successfully.");
        } catch (err) {
            alert("[ERROR] Permission denied: " + err.message);
        }
    }

    function changeRoom() {
        const code = document.getElementById('roomCode').value.trim();
        if (!code) return;
        currentRoom = code;
        dbRef.off();
        dbRef = db.ref('rooms/' + currentRoom + '/action');
        listenToFirebase();
        alert("Target Room Switched: " + currentRoom);
    }

    // অডিও ফাইল ইম্পোর্ট এবং সিরিয়াল লিস্ট তৈরি
    function importAudioFile(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            let audioList = JSON.parse(localStorage.getItem('mhx_audio_list') || '[]');
            audioList.push({
                name: file.name,
                data: e.target.result
            });
            localStorage.setItem('mhx_audio_list', JSON.stringify(audioList));
            loadAudioList();
            alert("ভয়েস সফলভাবে ইম্পোর্ট করা হয়েছে!");
        };
        reader.readAsDataURL(file);
    }

    // সিরিয়াল লিস্ট রেন্ডার করা (টগল প্লে/স্টপ এবং এডিট/রিনেম ফিচার সহ)
    function loadAudioList() {
        const container = document.getElementById('audioListContainer');
        container.innerHTML = '';
        let audioList = JSON.parse(localStorage.getItem('mhx_audio_list') || '[]');

        if (audioList.length === 0) {
            container.innerHTML = '<span style="font-size:10px; color:#64748b; text-align:center; display:block;">কোনো ভয়েস ইম্পোর্ট করা নেই।</span>';
            return;
        }

        audioList.forEach((item, index) => {
            const box = document.createElement('div');
            box.className = 'audio-item-box';
            box.draggable = true;

            box.innerHTML = `
                <div class="audio-info">
                    <span style="color:var(--neon-green); font-weight:bold;">[${index + 1}]</span>
                    <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:180px;">${item.name}</span>
                </div>
                <div class="audio-actions">
                    <span class="action-icon" title="Rename" onclick="renameAudio(event, ${index})">✏️</span>
                </div>
            `;

            // টগল প্লে/স্টপ সিস্টেম (একবার চাপলে বাজবে, আবার চাপলে বন্ধ হবে)
            box.onclick = (e) => {
                if (e.target.tagName === 'SPAN' && e.target.title === 'Rename') return;
                togglePlayAudio(item.data, box);
            };

            // লং প্রেস বা ড্র্যাগ করে ডিলিট করার হ্যান্ডলিং
            box.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', index);
                document.getElementById('trashZone').style.display = 'block';
            });

            box.addEventListener('dragend', () => {
                document.getElementById('trashZone').style.display = 'none';
            });

            container.appendChild(box);
        });
    }

    // ড্র্যাগ ওভার ট্র্যাশ জোন
    const trashZone = document.getElementById('trashZone');
    trashZone.addEventListener('dragover', (e) => { e.preventDefault(); });
    trashZone.addEventListener('drop', (e) => {
        e.preventDefault();
        const index = e.dataTransfer.getData('text/plain');
        if (index !== "") {
            deleteAudioItem(parseInt(index));
        }
        trashZone.style.display = 'none';
    });

    function deleteAudioItem(index) {
        let audioList = JSON.parse(localStorage.getItem('mhx_audio_list') || '[]');
        audioList.splice(index, 1);
        localStorage.setItem('mhx_audio_list', JSON.stringify(audioList));
        loadAudioList();
        alert("ভয়েস সফলভাবে ডিলিট করা হয়েছে!");
    }

    // রিনেম করার ফাংশন
    function renameAudio(event, index) {
        event.stopPropagation();
        let audioList = JSON.parse(localStorage.getItem('mhx_audio_list') || '[]');
        let newName = prompt("নতুন নাম লিখুন:", audioList[index].name);
        if (newName) {
            audioList[index].name = newName;
            localStorage.setItem('mhx_audio_list', JSON.stringify(audioList));
            loadAudioList();
        }
    }

    // টগল প্লে এবং স্টিলথ মোড হ্যান্ডেলিং
    function togglePlayAudio(dataUrl, boxElement) {
        if (audioCtx.state === 'suspended') audioCtx.resume();

        if (activeAudio) {
            activeAudio.pause();
            activeAudio = null;
            document.querySelectorAll('.audio-item-box').forEach(el => el.classList.remove('active-playing'));
            if (activeAudio && activeAudio.src === dataUrl) {
                return;
            }
        }

        const audio = new Audio(dataUrl);
        activeAudio = audio;
        boxElement.classList.add('active-playing');

        const isStealthOn = document.getElementById('stealthMode').checked;

        if (!isStealthOn) {
            audio.play();
        }

        if (micDestination) {
            try {
                const sourceNode = audioCtx.createMediaElementSource(audio);
                sourceNode.connect(micDestination);
                if (!isStealthOn) sourceNode.connect(audioCtx.destination);
                audio.play();
            } catch (e) {
                audio.play();
            }
        }

        audio.onended = () => {
            boxElement.classList.remove('active-playing');
            activeAudio = null;
        };
    }

    // টেক্সট টু স্পিচ ও প্রিসেট সিস্টেম
    function speakAndSendText() {
        const text = document.getElementById('ttsInput').value.trim();
        const lang = document.getElementById('langSelect').value;
        if (!text) return;

        const isStealthOn = document.getElementById('stealthMode').checked;
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;

        if (!isStealthOn) {
            window.speechSynthesis.speak(utterance);
        }

        dbRef.set({ sound: 'tts', text: text, lang: lang, timestamp: Date.now() });
    }

    function saveTextPreset() {
        const text = document.getElementById('ttsInput').value.trim();
        if (!text) return;
        let presets = JSON.parse(localStorage.getItem('mhx_presets') || '[]');
        presets.push(text);
        localStorage.setItem('mhx_presets', JSON.stringify(presets));
        loadPresets();
    }

    function loadPresets() {
        const container = document.getElementById('presetsList');
        container.innerHTML = '';
        let presets = JSON.parse(localStorage.getItem('mhx_presets') || '[]');
        presets.forEach((item) => {
            const chip = document.createElement('div');
            chip.style.cssText = "background:rgba(0,255,102,0.08); border:1px dashed var(--neon-green); color:var(--neon-green); padding:5px 8px; border-radius:4px; font-size:10px; margin-bottom:4px; cursor:pointer;";
            chip.innerText = "> " + item;
            chip.onclick = () => {
                document.getElementById('ttsInput').value = item;
                speakAndSendText();
            };
            container.appendChild(chip);
        });
    }

    function listenToFirebase() {
        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data && Date.now() - data.timestamp < 3000) {
                if (data.sound === 'tts' && data.text) {
                    const remoteUtterance = new SpeechSynthesisUtterance(data.text);
                    remoteUtterance.lang = data.lang;
                    window.speechSynthesis.speak(remoteUtterance);
                }
            }
        });
    }

    listenToFirebase();
</script>

</body>
</html>
