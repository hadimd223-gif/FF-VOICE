<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M H X VOICE WEB // SYSTEM</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #030712;
            --card-bg: rgba(5, 15, 25, 0.95);
            --neon-green: #00ff66;
            --neon-red: #ff003c;
            --green-glow: rgba(0, 255, 102, 0.3);
            --red-glow: rgba(255, 0, 60, 0.3);
            --text-main: #e2e8f0;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Share Tech Mono', monospace;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(rgba(0, 255, 102, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 102, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .hacker-container {
            width: 100%;
            max-width: 460px;
            background: var(--card-bg);
            border: 2px solid var(--neon-green);
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 0 25px var(--green-glow), inset 0 0 15px rgba(0, 255, 102, 0.05);
            position: relative;
            overflow: hidden;
        }

        .float-top-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            cursor: pointer;
            box-shadow: 0 0 8px var(--green-glow);
            transition: 0.2s;
            z-index: 100;
        }

        .float-top-btn:hover {
            background: var(--neon-green);
            color: #000;
        }

        .terminal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px dashed var(--neon-green);
            padding-bottom: 10px;
            padding-right: 60px;
        }

        .terminal-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 900;
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green);
            letter-spacing: 1px;
        }

        .system-status {
            font-size: 9px;
            padding: 3px 6px;
            border-radius: 4px;
            background: rgba(255, 0, 60, 0.1);
            color: var(--neon-red);
            border: 1px solid var(--neon-red);
        }

        .control-panel {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--neon-green);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 12px;
        }

        .label-title {
            font-size: 11px;
            color: var(--neon-green);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
            display: block;
            font-weight: 600;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        input[type="text"], textarea, select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--neon-green);
            background: #000;
            color: var(--neon-green);
            outline: none;
            font-size: 13px;
            font-family: 'Share Tech Mono', monospace;
            box-shadow: inset 0 0 8px var(--green-glow);
        }

        textarea {
            height: 50px;
            resize: none;
            margin-bottom: 8px;
        }

        .btn-cyber {
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            background: var(--neon-green);
            color: #030712;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 10px var(--green-glow);
            font-size: 11px;
        }

        .btn-cyber:hover {
            background: #fff;
        }

        .btn-red {
            background: var(--neon-red);
            color: #fff;
            box-shadow: 0 0 10px var(--red-glow);
        }

        .tts-box {
            background: rgba(0, 255, 102, 0.03);
            border: 1px solid var(--neon-green);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .btn-row {
            display: flex;
            gap: 8px;
        }

        .import-section-box {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid var(--neon-green);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .import-grid-wrapper {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 8px;
            max-height: 140px;
            overflow-y: auto;
        }

        .square-import-btn {
            aspect-ratio: 1;
            background: #000;
            border: 2px dashed var(--neon-green);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            padding: 5px;
        }

        .square-import-btn:hover {
            background: rgba(0, 255, 102, 0.15);
            box-shadow: 0 0 10px var(--green-glow);
        }

        .square-import-btn span {
            font-size: 16px;
            margin-bottom: 4px;
        }

        .square-import-btn label {
            cursor: pointer;
            color: var(--neon-green);
            font-size: 9px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .square-audio-card {
            aspect-ratio: 1;
            background: #050d14;
            border: 1px solid var(--neon-green);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 6px;
            cursor: pointer;
            position: relative;
            transition: 0.2s;
        }

        .square-audio-card.active-playing {
            border-color: var(--neon-red);
            background: rgba(255, 0, 60, 0.2);
            color: var(--neon-red);
            box-shadow: 0 0 15px var(--neon-red);
        }

        .square-audio-card .card-index {
            position: absolute;
            top: 4px;
            left: 6px;
            font-size: 9px;
            color: var(--neon-green);
            font-weight: bold;
        }

        .square-audio-card .card-icon {
            font-size: 14px;
            margin-bottom: 2px;
        }

        .square-audio-card .card-name {
            font-size: 9px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            word-break: break-all;
        }

        .square-audio-card .delete-btn {
            position: absolute;
            top: 2px;
            right: 4px;
            font-size: 10px;
            color: var(--neon-red);
            cursor: pointer;
        }

        .permission-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }

        .modal-box {
            width: 100%;
            max-width: 380px;
            background: #050f19;
            border: 2px solid var(--neon-green);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 30px var(--green-glow);
        }

        .modal-box h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: var(--neon-green);
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .modal-box p {
            font-size: 12px;
            color: var(--text-main);
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .btn-done {
            width: 100%;
            background: var(--neon-green);
            color: #030712;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 0 15px var(--green-glow);
        }

        .toggle-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .toggle-info span {
            font-size: 12px;
            font-weight: bold;
            color: var(--neon-red);
            text-shadow: 0 0 8px var(--neon-red);
            display: block;
        }

        .toggle-info small {
            font-size: 9px;
            color: var(--text-muted);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #1a0005;
            border: 1px solid var(--neon-red);
            transition: .3s;
            border-radius: 4px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: var(--neon-red);
            transition: .3s;
            border-radius: 2px;
        }

        input:checked + .slider {
            background-color: #001a0a;
            border-color: var(--neon-green);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
            background-color: var(--neon-green);
        }
    </style>
</head>
<body>

<div class="permission-modal" id="permissionModal">
    <div class="modal-box">
        <h2>SYSTEM PERMISSION REQUIRED</h2>
        <p>Microphone access is required to bridge audio payloads into the game or call channel smoothly.</p>
        <button class="btn-done" onclick="requestMicPermission()">DONE</button>
    </div>
</div>

<div class="hacker-container" id="mainContainer">
    <button class="float-top-btn" onclick="toggleFloatingMode()">📺 FLOAT</button>

    <div class="terminal-header">
        <h1>M H X VOICE WEB</h1>
        <div class="system-status" id="systemStatusBadge">STREAM MUTED</div>
    </div>

    <div class="control-panel">
        <span class="label-title">> TARGET_ROOM_ID</span>
        <div class="input-row">
            <input type="text" id="roomCode" value="M-H-X-01">
            <button class="btn-cyber" onclick="changeRoom()">CONNECT</button>
        </div>
    </div>

    <div class="control-panel">
        <div class="toggle-row toggle-box">
            <div class="toggle-info">
                <span>STEALTH BYPASS</span>
                <small>Local: Muted | Squad: Active</small>
            </div>
            <label class="switch">
                <input type="checkbox" id="stealthMode" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="btn-row" style="margin-bottom: 12px;">
        <button class="btn-cyber" style="flex:1;" onclick="enableStream()">🟢 STREAM ON</button>
        <button class="btn-cyber btn-red" style="flex:1;" onclick="disableStream()">🔴 STREAM OFF</button>
    </div>

    <div class="import-section-box">
        <span class="label-title">> AUDIO VAULT (SQUARE GRID)</span>
        
        <div class="import-grid-wrapper" id="audioGridContainer">
            <div class="square-import-btn" onclick="document.getElementById('audioFileInput').click()">
                <span>📁</span>
                <label>IMPORT</label>
                <input type="file" id="audioFileInput" accept="audio/*" style="display:none" onchange="importAudioFile(event)">
            </div>
        </div>
    </div>

    <div class="tts-box">
        <span class="label-title">> NATIVE TEXT-TO-SPEECH (HUMAN OPTIMIZED)</span>
        <select id="langSelect" style="margin-bottom: 8px;">
            <option value="bn-BD">বাংলা (Bangla)</option>
            <option value="en-US">English (US)</option>
        </select>
        <textarea id="ttsInput" placeholder="Enter text here..."></textarea>
        
        <div class="btn-row">
            <button class="btn-cyber btn-red" style="flex:1;" onclick="saveTextPreset()">SAVE</button>
            <button class="btn-cyber" style="flex:1;" onclick="speakAndSendText()">SEND</button>
        </div>
        
        <div class="saved-presets-container" id="presetsList" style="margin-top: 8px; max-height:65px; overflow-y:auto;"></div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyAJWDIhsO4nAnBvpVZ0FP3kIlHFEU2Ysq4",
      authDomain: "m-h-x-wab-7abdf.firebaseapp.com",
      databaseURL: "https://m-h-x-wab-7abdf-default-rtdb.firebaseio.com",
      projectId: "m-h-x-wab-7abdf",
      storageBucket: "m-h-x-wab-7abdf.firebasestorage.app",
      messagingSenderId: "570748526283",
      appId: "1:570748526283:web:a946d0c4d306226a88c54e",
      measurementId: "G-R56NJRER3Q"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let currentRoom = "M-H-X-01";
    let dbRef = db.ref('rooms/' + currentRoom + '/action');
    let micDestination = null;
    let micStreamSource = null;
    let activeStream = null;
    let activeAudio = null;
    let isStreamingActive = false;

    window.onload = function() {
        loadAudioGrid();
        loadPresets();
    };

    async function requestMicPermission() {
        try {
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            
            // অপ্টিমাইজড অডিও সেটিংস যাতে ল্যাগ বা নয়েজ না করে
            activeStream = await navigator.mediaDevices.getUserMedia({ 
                audio: {
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                }, 
                video: false 
            });
            
            micStreamSource = audioCtx.createMediaStreamSource(activeStream);
            micDestination = audioCtx.createMediaStreamDestination();
            
            micStreamSource.connect(micDestination);
            isStreamingActive = true;
            
            const badge = document.getElementById('systemStatusBadge');
            badge.innerText = "STREAMING ACTIVE";
            badge.style.borderColor = "var(--neon-green)";
            badge.style.color = "var(--neon-green)";
            badge.style.background = "rgba(0, 255, 102, 0.1)";
            
            document.getElementById('permissionModal').style.display = 'none';
        } catch (err) {
            alert("Microphone permission is required to stream audio into calls/games.");
        }
    }

    function enableStream() {
        if (!activeStream || !micDestination) {
            requestMicPermission();
            return;
        }
        isStreamingActive = true;
        const badge = document.getElementById('systemStatusBadge');
        badge.innerText = "STREAMING ACTIVE";
        badge.style.borderColor = "var(--neon-green)";
        badge.style.color = "var(--neon-green)";
        badge.style.background = "rgba(0, 255, 102, 0.1)";
        alert("Audio streaming enabled.");
    }

    function disableStream() {
        isStreamingActive = false;

        if (micStreamSource && micDestination) {
            try {
                micStreamSource.disconnect(micDestination);
            } catch(e) {}
        }

        if (activeStream) {
            activeStream.getTracks().forEach(track => track.stop());
            activeStream = null;
        }

        const badge = document.getElementById('systemStatusBadge');
        badge.innerText = "STREAM MUTED";
        badge.style.borderColor = "var(--neon-red)";
        badge.style.color = "var(--neon-red)";
        badge.style.background = "rgba(255, 0, 60, 0.1)";
        
        alert("Audio streaming disabled and mic access released.");
    }

    async function toggleFloatingMode() {
        try {
            if (document.pictureInPictureElement) {
                await document.exitPictureInPicture();
            } else {
                const canvas = document.createElement('canvas');
                canvas.width = 400; canvas.height = 600;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = "#030712";
                ctx.fillRect(0, 0, 400, 600);
                ctx.fillStyle = "#00ff66";
                ctx.font = "20px Orbitron";
                ctx.fillText("M H X VOICE WEB FLOATING", 30, 50);

                const video = document.createElement('video');
                video.srcObject = canvas.captureStream();
                video.autoplay = true;
                await video.requestPictureInPicture();
            }
        } catch (err) {
            alert("Floating mode is not fully supported on this browser.");
        }
    }

    function changeRoom() {
        const code = document.getElementById('roomCode').value.trim();
        if (!code) return;
        currentRoom = code;
        dbRef.off();
        dbRef = db.ref('rooms/' + currentRoom + '/action');
        listenToFirebase();
        alert("Target Room Switched: " + currentRoom);
    }

    function importAudioFile(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            let audioList = JSON.parse(localStorage.getItem('mhx_audio_list') || '[]');
            audioList.push({
                name: file.name,
                data: e.target.result
            });
            localStorage.setItem('mhx_audio_list', JSON.stringify(audioList));
            loadAudioGrid();
        };
        reader.readAsDataURL(file);
    }

    function loadAudioGrid() {
        const container = document.getElementById('audioGridContainer');
        container.innerHTML = `
            <div class="square-import-btn" onclick="document.getElementById('audioFileInput').click()">
                <span>📁</span>
                <label>IMPORT</label>
                <input type="file" id="audioFileInput" accept="audio/*" style="display:none" onchange="importAudioFile(event)">
            </div>
        `;

        let audioList = JSON.parse(localStorage.getItem('mhx_audio_list') || '[]');

        audioList.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'square-audio-card';

            card.innerHTML = `
                <span class="card-index">#${index + 1}</span>
                <span class="delete-btn" onclick="deleteAudioItem(event, ${index})">×</span>
                <span class="card-icon">🎵</span>
                <span class="card-name">${item.name}</span>
            `;

            card.onclick = (e) => {
                if (e.target.classList.contains('delete-btn')) return;
                togglePlayAudio(item.data, card);
            };

            container.appendChild(card);
        });
    }

    function deleteAudioItem(event, index) {
        event.stopPropagation();
        let audioList = JSON.parse(localStorage.getItem('mhx_audio_list') || '[]');
        audioList.splice(index, 1);
        localStorage.setItem('mhx_audio_list', JSON.stringify(audioList));
        loadAudioGrid();
    }

    function togglePlayAudio(dataUrl, cardElement) {
        if (audioCtx.state === 'suspended') audioCtx.resume();

        if (activeAudio && activeAudio.currentSrc === dataUrl) {
            activeAudio.pause();
            activeAudio = null;
            cardElement.classList.remove('active-playing');
            return;
        }

        if (activeAudio) {
            activeAudio.pause();
            activeAudio = null;
            document.querySelectorAll('.square-audio-card').forEach(el => el.classList.remove('active-playing'));
        }

        const audio = new Audio(dataUrl);
        activeAudio = audio;
        cardElement.classList.add('active-playing');

        const isStealthOn = document.getElementById('stealthMode').checked;

        if (!isStealthOn) {
            audio.play();
        }

        if (isStreamingActive && micDestination) {
            try {
                const sourceNode = audioCtx.createMediaElementSource(audio);
                sourceNode.connect(micDestination);
                if (!isStealthOn) sourceNode.connect(audioCtx.destination);
                audio.play();
            } catch (e) {
                audio.play();
            }
        }

        audio.onended = () => {
            cardElement.classList.remove('active-playing');
            activeAudio = null;
        };
    }

    function speakAndSendText() {
        const text = document.getElementById('ttsInput').value.trim();
        const lang = document.getElementById('langSelect').value;
        if (!text) return;

        const isStealthOn = document.getElementById('stealthMode').checked;
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        utterance.rate = 0.95;
        utterance.pitch = 1.05;

        if (!isStealthOn) {
            window.speechSynthesis.speak(utterance);
        }

        dbRef.set({ sound: 'tts', text: text, lang: lang, timestamp: Date.now() });
    }

    function saveTextPreset() {
        const text = document.getElementById('ttsInput').value.trim();
        if (!text) return;
        let presets = JSON.parse(localStorage.getItem('mhx_presets') || '[]');
        presets.push(text);
        localStorage.setItem('mhx_presets', JSON.stringify(presets));
        loadPresets();
    }

    function loadPresets() {
        const container = document.getElementById('presetsList');
        container.innerHTML = '';
        let presets = JSON.parse(localStorage.getItem('mhx_presets') || '[]');
        presets.forEach((item) => {
            const chip = document.createElement('div');
            chip.style.cssText = "background:rgba(0,255,102,0.08); border:1px dashed var(--neon-green); color:var(--neon-green); padding:4px 6px; border-radius:4px; font-size:9px; margin-bottom:3px; cursor:pointer;";
            chip.innerText = "> " + item;
            chip.onclick = () => {
                document.getElementById('ttsInput').value = item;
                speakAndSendText();
            };
            container.appendChild(chip);
        });
    }

    function listenToFirebase() {
        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data && Date.now() - data.timestamp < 3000) {
                if (data.sound === 'tts' && data.text) {
                    const remoteUtterance = new SpeechSynthesisUtterance(data.text);
                    remoteUtterance.lang = data.lang;
                    remoteUtterance.rate = 0.95;
                    remoteUtterance.pitch = 1.05;
                    window.speechSynthesis.speak(remoteUtterance);
                }
            }
        });
    }

    listenToFirebase();
</script>

</body>
</html>
