<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER-X // HACKER VIP SOUNDBOARD</title>
    <!-- রোবোটিক এবং হ্যাকার স্টাইলের ফন্ট (Orbitron) -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #030712;
            --card-bg: rgba(5, 15, 25, 0.9);
            --neon-green: #00ff66;
            --neon-red: #ff003c;
            --green-glow: rgba(0, 255, 102, 0.3);
            --red-glow: rgba(255, 0, 60, 0.3);
            --text-main: #e2e8f0;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Share Tech Mono', monospace;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(rgba(0, 255, 102, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 102, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .hacker-container {
            width: 100%;
            max-width: 460px;
            background: var(--card-bg);
            border: 2px solid var(--neon-green);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 25px var(--green-glow), inset 0 0 15px rgba(0, 255, 102, 0.05);
            position: relative;
            overflow: hidden;
        }

        /* টার্মিনাল স্ক্যানলাইন এফেক্ট */
        .hacker-container::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 10;
            pointer-events: none;
            opacity: 0.3;
        }

        .terminal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px dashed var(--neon-green);
            padding-bottom: 12px;
        }

        .terminal-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 900;
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green);
            letter-spacing: 2px;
        }

        .system-status {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 4px;
            background: rgba(0, 255, 102, 0.1);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
            box-shadow: 0 0 8px var(--green-glow);
        }

        .control-panel {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 255, 102, 0.2);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .label-title {
            font-size: 11px;
            color: var(--neon-green);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
            display: block;
            font-weight: 600;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid var(--neon-green);
            background: #000;
            color: var(--neon-green);
            outline: none;
            font-size: 14px;
            font-family: 'Share Tech Mono', monospace;
            box-shadow: inset 0 0 8px var(--green-glow);
        }

        .btn-cyber {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            background: var(--neon-green);
            color: #030712;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 12px var(--green-glow);
            font-size: 12px;
        }

        .btn-cyber:hover {
            background: #fff;
            box-shadow: 0 0 20px var(--neon-green);
        }

        /* হ্যাকার টগল সুইচ (লাল ও সবুজ থিম) */
        .toggle-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .toggle-info span {
            font-size: 13px;
            font-weight: bold;
            color: var(--neon-red);
            text-shadow: 0 0 8px var(--neon-red);
            display: block;
        }

        .toggle-info small {
            font-size: 10px;
            color: var(--text-muted);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #1a0005;
            border: 1px solid var(--neon-red);
            transition: .3s;
            border-radius: 4px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: var(--neon-red);
            transition: .3s;
            border-radius: 2px;
            box-shadow: 0 0 8px var(--neon-red);
        }

        input:checked + .slider {
            background-color: #001a0a;
            border-color: var(--neon-green);
        }

        input:checked + .slider:before {
            transform: translateX(24px);
            background-color: var(--neon-green);
            box-shadow: 0 0 8px var(--neon-green);
        }

        .mic-btn {
            width: 100%;
            background: linear-gradient(135deg, #ff003c 0%, #990024 100%);
            padding: 12px;
            border: 1px solid var(--neon-red);
            border-radius: 8px;
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 0 15px var(--red-glow);
            margin-bottom: 15px;
            transition: 0.3s;
        }

        .mic-btn:hover {
            box-shadow: 0 0 25px var(--neon-red);
        }

        /* সাউন্ড গ্রিড (হ্যাকার স্টাইল বাটন) */
        .sound-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .cyber-card {
            background: #000;
            border: 1px solid var(--neon-green);
            border-radius: 8px;
            padding: 12px 8px;
            color: var(--neon-green);
            font-size: 12px;
            font-family: 'Share Tech Mono', monospace;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            box-shadow: inset 0 0 8px rgba(0, 255, 102, 0.1);
        }

        .cyber-card:hover {
            background: rgba(0, 255, 102, 0.1);
            box-shadow: 0 0 12px var(--green-glow);
        }

        .cyber-card.active-playing {
            border-color: var(--neon-red);
            color: var(--neon-red);
            background: rgba(255, 0, 60, 0.15);
            box-shadow: 0 0 20px var(--neon-red);
            animation: pulse-red 1s infinite alternate;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 10px var(--neon-red); }
            100% { box-shadow: 0 0 25px var(--neon-red); }
        }

        .cyber-card span.icon {
            font-size: 20px;
        }

        .upload-terminal {
            background: #000;
            border: 1px dashed var(--neon-green);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
        }

        .upload-terminal label {
            cursor: pointer;
            color: var(--neon-green);
            font-size: 11px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="hacker-container">
    <div class="terminal-header">
        <h1>CYBER_X // ROOT</h1>
        <div class="system-status">SECURE.SYS</div>
    </div>

    <!-- রুম কোড প্যানেল -->
    <div class="control-panel">
        <span class="label-title">> TARGET_ROOM_ID</span>
        <div class="input-row">
            <input type="text" id="roomCode" value="HACK-FF-01">
            <button class="btn-cyber" onclick="changeRoom()">CONNECT</button>
        </div>
    </div>

    <!-- ভিআইপি স্টিলথ মোড সুইচ (সবুজ/লাল হ্যাকার থিম) -->
    <div class="control-panel">
        <div class="toggle-row toggle-box">
            <div class="toggle-info">
                <span>STEALTH BYPASS</span>
                <small>Local Speaker: Muted | Squad: Active</small>
            </div>
            <label class="switch">
                <input type="checkbox" id="stealthMode" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <!-- গেম মাইক ব্রিজ -->
    <button class="mic-btn" onclick="enableInGameMicBridge()">
        ⚡ ACTIVATE MIC INJECTION [ROOT]
    </button>

    <!-- সাউন্ডবোর্ড প্যানেল -->
    <span class="label-title">> EXECUTABLE_PAYLOADS</span>
    <div class="sound-grid" id="soundGrid">
        <button class="cyber-card" onclick="toggleSound('enemy', 440, 'sawtooth', this)">
            <span class="icon">🚨</span>
            <span>ENEMY_ALERT.wav</span>
        </button>
        <button class="cyber-card" onclick="toggleSound('help', 587, 'triangle', this)">
            <span class="icon">🆘</span>
            <span>SOS_HELP.wav</span>
        </button>
        <button class="cyber-card" onclick="toggleSound('rush', 659, 'square', this)">
            <span class="icon">⚡</span>
            <span>RUSH_ATTACK.wav</span>
        </button>
        <button class="cyber-card" onclick="toggleSound('booyah', 880, 'sine', this)">
            <span class="icon">🔥</span>
            <span>VICTORY_BOOYAH</span>
        </button>
    </div>

    <!-- কাস্টম ফাইল আপলোড -->
    <div class="upload-terminal">
        <label for="audioFile">
            + INJECT CUSTOM PAYLOAD (.MP3)
        </label>
        <input type="file" id="audioFile" accept="audio/*" style="display:none" onchange="loadCustomAudio(event)">
    </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
    // আপনার ফায়ারবেস কনফিগারেশন
    const firebaseConfig = {
      apiKey: "AIzaSyAJWDIhsO4nAnBvpVZ0FP3kIlHFEU2Ysq4",
      authDomain: "m-h-x-wab-7abdf.firebaseapp.com",
      databaseURL: "https://m-h-x-wab-7abdf-default-rtdb.firebaseio.com",
      projectId: "m-h-x-wab-7abdf",
      storageBucket: "m-h-x-wab-7abdf.firebasestorage.app",
      messagingSenderId: "570748526283",
      appId: "1:570748526283:web:a946d0c4d306226a88c54e",
      measurementId: "G-R56NJRER3Q"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let currentRoom = "HACK-FF-01";
    let dbRef = db.ref('rooms/' + currentRoom + '/action');
    let micDestination = null;

    let activePlayer = {
        name: null,
        sourceNode: null,
        oscillator: null,
        buttonElement: null
    };

    async function enableInGameMicBridge() {
        try {
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            
            const micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            const sourceNode = audioCtx.createMediaStreamSource(micStream);
            
            const dest = audioCtx.createMediaStreamDestination();
            sourceNode.connect(dest);
            
            micDestination = dest;
            alert("[SUCCESS] Mic injection protocol initialized successfully for Squad.");
        } catch (err) {
            alert("[ERROR] Permission denied or blocked: " + err.message);
        }
    }

    function changeRoom() {
        const code = document.getElementById('roomCode').value.trim();
        if (!code) return;
        currentRoom = code;
        dbRef.off();
        dbRef = db.ref('rooms/' + currentRoom + '/action');
        listenToFirebase();
        alert("Target Room Switched to: " + currentRoom);
    }

    // টগল সাউন্ড সিস্টেম (একবার চাপলে চালু, আবার চাপলে বন্ধ)
    function toggleSound(name, freq, type, btnElement) {
        if (audioCtx.state === 'suspended') audioCtx.resume();

        if (activePlayer.name === name) {
            stopActiveSound();
            dbRef.set({ sound: 'STOP', timestamp: Date.now() });
            return;
        }

        stopActiveSound();
        const isStealthOn = document.getElementById('stealthMode').checked;
        playTone(name, freq, type, isStealthOn, btnElement);

        dbRef.set({
            sound: name,
            freq: freq,
            type: type,
            action: 'PLAY',
            timestamp: Date.now()
        });
    }

    function playTone(name, freq, type, silentForMe, btnElement) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        
        if (!silentForMe) {
            osc.connect(gain);
            gain.connect(audioCtx.destination);
        }

        if (micDestination) {
            osc.connect(gain);
            gain.connect(micDestination);
        }
        
        osc.start();
        
        activePlayer = {
            name: name,
            oscillator: osc,
            buttonElement: btnElement
        };

        if (btnElement) {
            btnElement.classList.add('active-playing');
        }
    }

    function stopActiveSound() {
        if (activePlayer.oscillator) {
            try {
                activePlayer.oscillator.stop();
                activePlayer.oscillator.disconnect();
            } catch(e) {}
        }
        if (activePlayer.sourceNode) {
            try {
                activePlayer.sourceNode.stop();
                activePlayer.sourceNode.disconnect();
            } catch(e) {}
        }
        if (activePlayer.buttonElement) {
            activePlayer.buttonElement.classList.remove('active-playing');
        }
        activePlayer = { name: null, sourceNode: null, oscillator: null, buttonElement: null };
    }

    function listenToFirebase() {
        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data && Date.now() - data.timestamp < 3000) {
                if (data.action === 'STOP' || data.sound === 'STOP') {
                    // রিমোট অফ সিগন্যাল
                }
            }
        });
    }

    function loadCustomAudio(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            audioCtx.decodeAudioData(e.target.result, function(buffer) {
                const grid = document.getElementById('soundGrid');
                const btn = document.createElement('button');
                const soundKey = 'custom_' + Date.now();
                btn.className = 'cyber-card';
                btn.innerHTML = `<span class="icon">🎵</span><span>${file.name.substring(0, 10)}</span>`;
                
                btn.onclick = () => {
                    if (activePlayer.name === soundKey) {
                        stopActiveSound();
                    } else {
                        stopActiveSound();
                        const isStealthOn = document.getElementById('stealthMode').checked;
                        playCustomBuffer(buffer, isStealthOn, btn, soundKey);
                    }
                };
                grid.appendChild(btn);
            });
        };
        reader.readAsArrayBuffer(file);
    }

    function playCustomBuffer(buffer, silentForMe, btnElement, soundKey) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;

        if (!silentForMe) {
            source.connect(audioCtx.destination);
        }
        if (micDestination) {
            source.connect(micDestination);
        }

        source.start(0);

        activePlayer = {
            name: soundKey,
            sourceNode: source,
            buttonElement: btnElement
        };

        if (btnElement) {
            btnElement.classList.add('active-playing');
        }

        source.onended = () => {
            stopActiveSound();
        };
    }

    listenToFirebase();
</script>

</body>
</html>
