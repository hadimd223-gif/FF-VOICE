<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER-X // CUSTOM AUDIO INJECTOR</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #030712;
            --card-bg: rgba(5, 15, 25, 0.92);
            --neon-green: #00ff66;
            --neon-red: #ff003c;
            --green-glow: rgba(0, 255, 102, 0.3);
            --red-glow: rgba(255, 0, 60, 0.3);
            --text-main: #e2e8f0;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Share Tech Mono', monospace;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(rgba(0, 255, 102, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 102, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .hacker-container {
            width: 100%;
            max-width: 460px;
            background: var(--card-bg);
            border: 2px solid var(--neon-green);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 25px var(--green-glow), inset 0 0 15px rgba(0, 255, 102, 0.05);
            position: relative;
            overflow: hidden;
        }

        .terminal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px dashed var(--neon-green);
            padding-bottom: 10px;
        }

        .terminal-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 900;
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green);
            letter-spacing: 2px;
        }

        .system-status {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 4px;
            background: rgba(0, 255, 102, 0.1);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
        }

        .control-panel {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--neon-green);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 12px;
        }

        .label-title {
            font-size: 11px;
            color: var(--neon-green);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
            display: block;
            font-weight: 600;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        input[type="text"], textarea, select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--neon-green);
            background: #000;
            color: var(--neon-green);
            outline: none;
            font-size: 13px;
            font-family: 'Share Tech Mono', monospace;
            box-shadow: inset 0 0 8px var(--green-glow);
        }

        textarea {
            height: 55px;
            resize: none;
            margin-bottom: 8px;
        }

        .btn-cyber {
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            background: var(--neon-green);
            color: #030712;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 10px var(--green-glow);
            font-size: 11px;
        }

        .btn-cyber:hover {
            background: #fff;
        }

        .btn-red {
            background: var(--neon-red);
            color: #fff;
            box-shadow: 0 0 10px var(--red-glow);
        }

        .tts-box {
            background: rgba(0, 255, 102, 0.03);
            border: 1px solid var(--neon-green);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .btn-row {
            display: flex;
            gap: 8px;
        }

        /* প্রিসেট ও ইম্পোর্ট ভয়েস লিস্ট */
        .saved-presets-container {
            margin-top: 8px;
            max-height: 90px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .preset-chip {
            background: rgba(0, 255, 102, 0.08);
            border: 1px dashed var(--neon-green);
            color: var(--neon-green);
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }

        .preset-chip:hover {
            background: rgba(0, 255, 102, 0.2);
        }

        .preset-chip.active-playing {
            border-color: var(--neon-red);
            color: var(--neon-red);
            background: rgba(255, 0, 60, 0.15);
            box-shadow: 0 0 12px var(--neon-red);
        }

        /* ইম্পোর্ট ভয়েস আপলোড বক্স */
        .import-box {
            background: #000;
            border: 2px dashed var(--neon-green);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 12px;
            transition: 0.3s;
        }

        .import-box:hover {
            background: rgba(0, 255, 102, 0.08);
        }

        .import-box label {
            cursor: pointer;
            color: var(--neon-green);
            font-size: 11px;
            display: block;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* টগল সুইচ */
        .toggle-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .toggle-info span {
            font-size: 12px;
            font-weight: bold;
            color: var(--neon-red);
            text-shadow: 0 0 8px var(--neon-red);
            display: block;
        }

        .toggle-info small {
            font-size: 9px;
            color: var(--text-muted);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #1a0005;
            border: 1px solid var(--neon-red);
            transition: .3s;
            border-radius: 4px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: var(--neon-red);
            transition: .3s;
            border-radius: 2px;
        }

        input:checked + .slider {
            background-color: #001a0a;
            border-color: var(--neon-green);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
            background-color: var(--neon-green);
        }

        .mic-btn {
            width: 100%;
            background: linear-gradient(135deg, #ff003c 0%, #990024 100%);
            padding: 10px;
            border: 1px solid var(--neon-red);
            border-radius: 6px;
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 11px;
            cursor: pointer;
            box-shadow: 0 0 12px var(--red-glow);
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

<div class="hacker-container">
    <div class="terminal-header">
        <h1>CYBER-X // AUDIO INJECTOR</h1>
        <div class="system-status">ACTIVE</div>
    </div>

    <!-- রুম কোড প্যানেল -->
    <div class="control-panel">
        <span class="label-title">> TARGET_ROOM_ID</span>
        <div class="input-row">
            <input type="text" id="roomCode" value="HACK-FF-01">
            <button class="btn-cyber" onclick="changeRoom()">CONNECT</button>
        </div>
    </div>

    <!-- ভিআইপি স্টিলথ মোড -->
    <div class="control-panel">
        <div class="toggle-row toggle-box">
            <div class="toggle-info">
                <span>STEALTH BYPASS</span>
                <small>Local: Muted | Squad: Active</small>
            </div>
            <label class="switch">
                <input type="checkbox" id="stealthMode" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <!-- গেম মাইক ব্রিজ -->
    <button class="mic-btn" onclick="enableInGameMicBridge()">
        ⚡ ACTIVATE MIC INJECTION [ROOT]
    </button>

    <!-- নতুন অপশন: ইম্পোর্ট ভয়েস (মিউজিক ফাইল বা ভয়েস আপলোড) -->
    <div class="import-box">
        <label for="audioFileInput">
            📁 [+ ইম্পোর্ট ভয়েস / মিউজিক ফাইল যোগ করুন]
        </label>
        <input type="file" id="audioFileInput" accept="audio/*" style="display:none" onchange="importAudioFile(event)">
    </div>

    <!-- টেক্সট-টু-স্পিচ এবং সেভ/সেন্ড প্যানেল -->
    <div class="tts-box">
        <span class="label-title">> VOICE SYNTHESIS & PRESETS</span>
        
        <select id="langSelect" style="margin-bottom: 8px;">
            <option value="bn-BD">বাংলা (Bangla)</option>
            <option value="en-US">English (US)</option>
        </select>

        <textarea id="ttsInput" placeholder="এখানে টেক্সট লিখুন..."></textarea>
        
        <div class="btn-row" style="margin-bottom: 8px;">
            <button class="btn-cyber btn-red" style="flex:1;" onclick="saveTextPreset()">💾 সেভ করুন</button>
            <button class="btn-cyber" style="flex:1;" onclick="speakAndSendText()">🚀 সেন্ড করুন</button>
        </div>

        <span class="label-title" style="font-size: 10px; margin-top: 8px;">> SAVED PRESETS & IMPORTED AUDIO:</span>
        <div class="saved-presets-container" id="presetsList">
            <!-- সেভ করা লেখা ও ইম্পোর্ট করা মিউজিক ফাইল এখানে শো করবে -->
        </div>
    </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyAJWDIhsO4nAnBvpVZ0FP3kIlHFEU2Ysq4",
      authDomain: "m-h-x-wab-7abdf.firebaseapp.com",
      databaseURL: "https://m-h-x-wab-7abdf-default-rtdb.firebaseio.com",
      projectId: "m-h-x-wab-7abdf",
      storageBucket: "m-h-x-wab-7abdf.firebasestorage.app",
      messagingSenderId: "570748526283",
      appId: "1:570748526283:web:a946d0c4d306226a88c54e",
      measurementId: "G-R56NJRER3Q"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let currentRoom = "HACK-FF-01";
    let dbRef = db.ref('rooms/' + currentRoom + '/action');
    let micDestination = null;
    let activeAudioElement = null; // ব্যাকগ্রাউন্ড অডিও ট্র্যাক কন্ট্রোল করার জন্য

    window.onload = function() {
        loadPresets();
    };

    async function enableInGameMicBridge() {
        try {
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            const micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            const sourceNode = audioCtx.createMediaStreamSource(micStream);
            const dest = audioCtx.createMediaStreamDestination();
            sourceNode.connect(dest);
            micDestination = dest;
            alert("[SUCCESS] Mic injection protocol initialized successfully.");
        } catch (err) {
            alert("[ERROR] Permission denied: " + err.message);
        }
    }

    function changeRoom() {
        const code = document.getElementById('roomCode').value.trim();
        if (!code) return;
        currentRoom = code;
        dbRef.off();
        dbRef = db.ref('rooms/' + currentRoom + '/action');
        listenToFirebase();
        alert("Target Room Switched: " + currentRoom);
    }

    // ব্যাকগ্রাউন্ডে মিউজিক বা ভয়েস ফাইল প্লে এবং টিমমেটদের শোনানোর ফাংশন
    function playAudioFile(url, fileName, chipElement) {
        if (audioCtx.state === 'suspended') audioCtx.resume();

        // যদি আগে থেকেই কোনো অডিও চলতে থাকে, তবে সেটি বন্ধ করে দেবো (টগল সিস্টেম)
        if (activeAudioElement) {
            activeAudioElement.pause();
            activeAudioElement = null;
            document.querySelectorAll('.preset-chip').forEach(el => el.classList.remove('active-playing'));
            if (activeAudioElement && activeAudioElement.src === url) {
                dbRef.set({ sound: 'AUDIO_STOP', timestamp: Date.now() });
                return;
            }
        }

        const audio = new Audio(url);
        audio.loop = true; // ব্যাকগ্রাউন্ডে লুপ হয়ে চলার জন্য
        activeAudioElement = audio;
        if (chipElement) chipElement.classList.add('active-playing');

        const isStealthOn = document.getElementById('stealthMode').checked;

        // যদি স্টিলথ মোড অফ থাকে, তবে নিজের ফোনে স্পিকারে বাজবে
        if (!isStealthOn) {
            audio.play();
        }

        // যদি মাইক ব্রিজ অন থাকে, তবে গেমের মাইকের মাধ্যমে টিমমেটদের কাছে রাউট হবে
        if (micDestination) {
            try {
                const sourceNode = audioCtx.createMediaElementSource(audio);
                sourceNode.connect(micDestination);
                if (!isStealthOn) sourceNode.connect(audioCtx.destination);
                audio.play();
            } catch (e) {
                audio.play();
            }
        }

        // ফায়ারবেসের মাধ্যমে রুমের অন্য টিমমেটদের সিগন্যাল পাঠানো
        dbRef.set({
            sound: 'custom_audio',
            audioUrl: url,
            fileName: fileName,
            timestamp: Date.now()
        });
    }

    // ফাইল ম্যানেজার থেকে নতুন মিউজিক বা ভয়েস ফাইল ইম্পোর্ট করা
    function importAudioFile(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const audioDataUrl = e.target.result;
            let savedPresets = JSON.parse(localStorage.getItem('ff_hacker_presets') || '[]');
            
            // অবজেক্ট আকারে ফাইল সেভ করা (টাইপ মিউজিক বা টেক্সট বুঝানোর জন্য)
            const newItem = {
                type: 'audio',
                name: file.name,
                data: audioDataUrl
            };

            savedPresets.push(newItem);
            localStorage.setItem('ff_hacker_presets', JSON.stringify(savedPresets));
            loadPresets();
            alert("সফলভাবে ভয়েস/মিউজিক ফাইল ইম্পোর্ট করা হয়েছে!");
        };
        reader.readAsDataURL(file);
    }

    // টেক্সট সেন্ড করার ফাংশন
    function speakAndSendText() {
        const text = document.getElementById('ttsInput').value.trim();
        const lang = document.getElementById('langSelect').value;
        if (!text) {
            alert("অনুগ্রহ করে কিছু টেক্সট লিখুন!");
            return;
        }
        executeSpeechAndSync(text, lang);
    }

    function executeSpeechAndSync(text, lang) {
        const isStealthOn = document.getElementById('stealthMode').checked;

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        utterance.rate = 1.0;

        if (!isStealthOn) {
            window.speechSynthesis.speak(utterance);
        }

        dbRef.set({
            sound: 'native_tts',
            text: text,
            lang: lang,
            timestamp: Date.now()
        });
    }

    // টেক্সট সেভ করার ফাংশন
    function saveTextPreset() {
        const text = document.getElementById('ttsInput').value.trim();
        if (!text) {
            alert("সেভ করার জন্য বক্সে কিছু লিখুন!");
            return;
        }

        let savedPresets = JSON.parse(localStorage.getItem('ff_hacker_presets') || '[]');
        const newItem = {
            type: 'text',
            content: text
        };

        savedPresets.push(newItem);
        localStorage.setItem('ff_hacker_presets', JSON.stringify(savedPresets));
        loadPresets();
        alert("টেক্সট সফলভাবে সেভ করা হয়েছে!");
    }

    // সেভ করা আইটেম এবং ইম্পোর্ট করা ফাইলগুলো স্ক্রিনে দেখানো
    function loadPresets() {
        const container = document.getElementById('presetsList');
        container.innerHTML = '';
        let savedPresets = JSON.parse(localStorage.getItem('ff_hacker_presets') || '[]');

        if (savedPresets.length === 0) {
            container.innerHTML = '<span style="font-size:10px; color:#64748b;">কোনো ফাইল বা টেক্সট সেভ করা নেই।</span>';
            return;
        }

        savedPresets.forEach((item, index) => {
            const chip = document.createElement('div');
            chip.className = 'preset-chip';

            if (item.type === 'audio') {
                chip.innerHTML = `<span>🎵 [AUDIO] ${item.name.substring(0, 20)}...</span> <span style="color:var(--neon-red); cursor:pointer;" onclick="deletePreset(event, ${index})">[X]</span>`;
                chip.onclick = (e) => {
                    if(e.target.tagName !== 'SPAN' || e.target.innerText !== '[X]') {
                        playAudioFile(item.data, item.name, chip);
                    }
                };
            } else {
                chip.innerHTML = `<span>💬 ${item.content.substring(0, 22)}...</span> <span style="color:var(--neon-red); cursor:pointer;" onclick="deletePreset(event, ${index})">[X]</span>`;
                chip.onclick = (e) => {
                    if(e.target.tagName !== 'SPAN' || e.target.innerText !== '[X]') {
                        document.getElementById('ttsInput').value = item.content;
                        executeSpeechAndSync(item.content, document.getElementById('langSelect').value);
                    }
                };
            }
            container.appendChild(chip);
        });
    }

    function deletePreset(event, index) {
        event.stopPropagation();
        let savedPresets = JSON.parse(localStorage.getItem('ff_hacker_presets') || '[]');
        savedPresets.splice(index, 1);
        localStorage.setItem('ff_hacker_presets', JSON.stringify(savedPresets));
        loadPresets();
    }

    function listenToFirebase() {
        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data && Date.now() - data.timestamp < 3000) {
                if (data.sound === 'native_tts' && data.text) {
                    const remoteUtterance = new SpeechSynthesisUtterance(data.text);
                    remoteUtterance.lang = data.lang;
                    window.speechSynthesis.speak(remoteUtterance);
                } else if (data.sound === 'custom_audio' && data.audioUrl) {
                    const remoteAudio = new Audio(data.audioUrl);
                    remoteAudio.play().catch(e => console.log(e));
                }
            }
        });
    }

    listenToFirebase();
</script>

</body>
</html>
