<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER-X // AI VOICE CLONE INJECTOR</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #030712;
            --card-bg: rgba(5, 15, 25, 0.92);
            --neon-green: #00ff66;
            --neon-red: #ff003c;
            --green-glow: rgba(0, 255, 102, 0.3);
            --red-glow: rgba(255, 0, 60, 0.3);
            --text-main: #e2e8f0;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Share Tech Mono', monospace;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(rgba(0, 255, 102, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 102, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .hacker-container {
            width: 100%;
            max-width: 460px;
            background: var(--card-bg);
            border: 2px solid var(--neon-green);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 25px var(--green-glow), inset 0 0 15px rgba(0, 255, 102, 0.05);
            position: relative;
            overflow: hidden;
        }

        .terminal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px dashed var(--neon-green);
            padding-bottom: 10px;
        }

        .terminal-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            font-weight: 900;
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green);
            letter-spacing: 2px;
        }

        .system-status {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 4px;
            background: rgba(0, 255, 102, 0.1);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
        }

        .control-panel {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 255, 102, 0.2);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 12px;
        }

        .label-title {
            font-size: 11px;
            color: var(--neon-green);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
            display: block;
            font-weight: 600;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        input[type="text"], textarea, select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--neon-green);
            background: #000;
            color: var(--neon-green);
            outline: none;
            font-size: 13px;
            font-family: 'Share Tech Mono', monospace;
            box-shadow: inset 0 0 8px var(--green-glow);
        }

        textarea {
            height: 65px;
            resize: none;
            margin-bottom: 8px;
        }

        .btn-cyber {
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            background: var(--neon-green);
            color: #030712;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 10px var(--green-glow);
            font-size: 11px;
        }

        .btn-cyber:hover {
            background: #fff;
        }

        .tts-box {
            background: rgba(0, 255, 102, 0.03);
            border: 1px solid var(--neon-green);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }

        /* টগল সুইচ */
        .toggle-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .toggle-info span {
            font-size: 12px;
            font-weight: bold;
            color: var(--neon-red);
            text-shadow: 0 0 8px var(--neon-red);
            display: block;
        }

        .toggle-info small {
            font-size: 9px;
            color: var(--text-muted);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #1a0005;
            border: 1px solid var(--neon-red);
            transition: .3s;
            border-radius: 4px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: var(--neon-red);
            transition: .3s;
            border-radius: 2px;
        }

        input:checked + .slider {
            background-color: #001a0a;
            border-color: var(--neon-green);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
            background-color: var(--neon-green);
        }

        .mic-btn {
            width: 100%;
            background: linear-gradient(135deg, #ff003c 0%, #990024 100%);
            padding: 10px;
            border: 1px solid var(--neon-red);
            border-radius: 6px;
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 11px;
            cursor: pointer;
            box-shadow: 0 0 12px var(--red-glow);
            margin-bottom: 12px;
        }

        .sound-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .cyber-card {
            background: #000;
            border: 1px solid var(--neon-green);
            border-radius: 6px;
            padding: 10px 6px;
            color: var(--neon-green);
            font-size: 11px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: 0.2s;
        }

        .cyber-card.active-playing {
            border-color: var(--neon-red);
            color: var(--neon-red);
            background: rgba(255, 0, 60, 0.15);
            box-shadow: 0 0 15px var(--neon-red);
        }
    </style>
</head>
<body>

<div class="hacker-container">
    <div class="terminal-header">
        <h1>CYBER-X // AI CLONE</h1>
        <div class="system-status">ONLINE</div>
    </div>

    <!-- রুম কোড প্যানেল -->
    <div class="control-panel">
        <span class="label-title">> TARGET_ROOM_ID</span>
        <div class="input-row">
            <input type="text" id="roomCode" value="HACK-FF-01">
            <button class="btn-cyber" onclick="changeRoom()">CONNECT</button>
        </div>
    </div>

    <!-- ভিআইপি স্টিলথ মোড -->
    <div class="control-panel">
        <div class="toggle-row toggle-box">
            <div class="toggle-info">
                <span>STEALTH BYPASS</span>
                <small>Local: Muted | Squad: Active</small>
            </div>
            <label class="switch">
                <input type="checkbox" id="stealthMode" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <!-- গেম মাইক ব্রিজ -->
    <button class="mic-btn" onclick="enableInGameMicBridge()">
        ⚡ ACTIVATE MIC INJECTION [ROOT]
    </button>

    <!-- এআই ভয়েস ক্লোন ও টেক্সট-টু-স্পিচ বক্স -->
    <div class="tts-box">
        <span class="label-title">> SELECT CLONED VOICE & CONVERT</span>
        
        <!-- আগে থেকে সেট করা ক্লোন ভয়েসগুলোর ড্রপডাউন -->
        <label style="font-size: 10px; color: #64748b; display: block; margin-bottom: 4px;">CHOOSE VOICE PROFILE:</label>
        <select id="voiceSelect" style="margin-bottom: 8px;">
            <!-- এখানে আপনার ইচ্ছেমতো ভয়েস আইডি এবং নাম সেট করে রাখতে পারবেন -->
            <option value="21m00Tcm4TlvDq8ikWAM">Rachel (Professional Female)</option>
            <option value="AZnzlk1XvdvUeBnXmlld">Domi (Energetic Gaming)</option>
            <option value="EXAVITQu4vr4xnSDxMaL">Bella (Soft Voice)</option>
            <option value="ErXwobaYiN019PkySvjV">Antoni (Deep Male Voice)</option>
        </select>

        <textarea id="ttsInput" placeholder="এখানে টেক্সট লিখুন (বাংলা বা ইংরেজি)..."></textarea>
        <button class="btn-cyber" style="width: 100%;" onclick="generateAICloneVoice()">🗣️ GENERATE & SEND TO SQUAD</button>
    </div>

    <!-- ক্লাসিক সাউন্ডবোর্ড প্যানেল -->
    <span class="label-title">> QUICK PAYLOADS</span>
    <div class="sound-grid" id="soundGrid">
        <button class="cyber-card" onclick="toggleSound('enemy', 440, 'sawtooth', this)">
            <span>🚨</span>
            <span>ENEMY_ALERT</span>
        </button>
        <button class="cyber-card" onclick="toggleSound('help', 587, 'triangle', this)">
            <span>🆘</span>
            <span>SOS_HELP</span>
        </button>
        <button class="cyber-card" onclick="toggleSound('rush', 659, 'square', this)">
            <span>⚡</span>
            <span>RUSH_ATTACK</span>
        </button>
        <button class="cyber-card" onclick="toggleSound('booyah', 880, 'sine', this)">
            <span>🔥</span>
            <span>VICTORY_BOOYAH</span>
        </button>
    </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
    // ফায়ারবেস কনফিগারেশন
    const firebaseConfig = {
      apiKey: "AIzaSyAJWDIhsO4nAnBvpVZ0FP3kIlHFEU2Ysq4",
      authDomain: "m-h-x-wab-7abdf.firebaseapp.com",
      databaseURL: "https://m-h-x-wab-7abdf-default-rtdb.firebaseio.com",
      projectId: "m-h-x-wab-7abdf",
      storageBucket: "m-h-x-wab-7abdf.firebasestorage.app",
      messagingSenderId: "570748526283",
      appId: "1:570748526283:web:a946d0c4d306226a88c54e",
      measurementId: "G-R56NJRER3Q"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let currentRoom = "HACK-FF-01";
    let dbRef = db.ref('rooms/' + currentRoom + '/action');
    let micDestination = null;
    let activePlayer = { name: null, oscillator: null, buttonElement: null };

    // আপনার ElevenLabs এপিআই কি এখানে বসিয়ে দেবেন (যেটি আপনি আগে পেয়েছিলেন)
    const ELEVENLABS_API_KEY = "AIzaSyAJWDIhsO4nAnBvpVZ0FP3kIlHFEU2Ysq4"; // আপনার এপিআই কি এখানে আপডেট করে নিন

    async function enableInGameMicBridge() {
        try {
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            const micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            const sourceNode = audioCtx.createMediaStreamSource(micStream);
            const dest = audioCtx.createMediaStreamDestination();
            sourceNode.connect(dest);
            micDestination = dest;
            alert("[SUCCESS] Mic injection protocol initialized successfully.");
        } catch (err) {
            alert("[ERROR] Permission denied: " + err.message);
        }
    }

    function changeRoom() {
        const code = document.getElementById('roomCode').value.trim();
        if (!code) return;
        currentRoom = code;
        dbRef.off();
        dbRef = db.ref('rooms/' + currentRoom + '/action');
        listenToFirebase();
        alert("Target Room Switched: " + currentRoom);
    }

    // ElevenLabs এপিআই ব্যবহার করে সিলেক্ট করা ভয়েসে টেক্সট কনভার্ট করার ফাংশন
    async function generateAICloneVoice() {
        const text = document.getElementById('ttsInput').value.trim();
        const voiceId = document.getElementById('voiceSelect').value;
        if (!text) {
            alert("অনুগ্রহ করে কিছু টেক্সট লিখুন!");
            return;
        }

        alert("এআই ভয়েস প্রসেসিং হচ্ছে, একটু অপেক্ষা করুন...");

        try {
            const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, {
                method: 'POST',
                headers: {
                    "Accept": "audio/mpeg",
                    "Content-Type": "application/json",
                    "xi-api-key": ELEVENLABS_API_KEY
                },
                body: JSON.stringify({
                    text: text,
                    model_id: "eleven_multilingual_v2", // বাংলা ও ইংরেজির জন্য সেরা মাল্টিলিঙ্গুয়াল মডেল
                    voice_settings: {
                        stability: 0.5,
                        similarity_boost: 0.75
                    }
                })
            });

            if (!response.ok) {
                throw new Error("এপিআই কানেকশন ফেইল করেছে। আপনার এপিআই কি চেক করুন।");
            }

            const audioBlob = await response.blob();
            const audioUrl = URL.createObjectURL(audioBlob);
            const audio = new Audio(audioUrl);

            const isStealthOn = document.getElementById('stealthMode').checked;

            // যদি স্টিলথ মোড অফ থাকে, তবে নিজের ফোনে স্পিকারে বাজবে
            if (!isStealthOn) {
                audio.play();
            }

            // যদি মাইক ব্রিজ অন থাকে, তবে গেমের মাইকের মাধ্যমে টিমমেটরা শুনতে পাবে
            if (micDestination && audioCtx) {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const source = audioCtx.createMediaElementSource(audio);
                source.connect(micDestination);
                source.connect(audioCtx.destination);
                audio.play();
            }

            // ফায়ারবেসের মাধ্যমে টিমমেটদের কাছে অডিও লিংক বা সিগন্যাল পাঠানো
            dbRef.set({
                sound: 'ai_voice',
                audioUrl: audioUrl,
                timestamp: Date.now()
            });

            alert("সফলভাবে এআই ভয়েস জেনারেট এবং ইনজেক্ট করা হয়েছে!");

        } catch (error) {
            alert("ত্রুটি: " + error.message);
        }
    }

    function toggleSound(name, freq, type, btnElement) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        if (activePlayer.name === name) {
            stopActiveSound();
            return;
        }
        stopActiveSound();
        const isStealthOn = document.getElementById('stealthMode').checked;
        
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);

        if (!isStealthOn) {
            osc.connect(gain);
            gain.connect(audioCtx.destination);
        }
        if (micDestination) {
            osc.connect(gain);
            gain.connect(micDestination);
        }
        osc.start();
        
        activePlayer = { name: name, oscillator: osc, buttonElement: btnElement };
        if (btnElement) btnElement.classList.add('active-playing');

        dbRef.set({ sound: name, freq: freq, type: type, timestamp: Date.now() });
    }

    function stopActiveSound() {
        if (activePlayer.oscillator) {
            try { activePlayer.oscillator.stop(); activePlayer.oscillator.disconnect(); } catch(e) {}
        }
        if (activePlayer.buttonElement) activePlayer.buttonElement.classList.remove('active-playing');
        activePlayer = { name: null, oscillator: null, buttonElement: null };
    }

    function listenToFirebase() {
        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data && Date.now() - data.timestamp < 3000) {
                if (data.sound === 'ai_voice' && data.audioUrl) {
                    const remoteAudio = new Audio(data.audioUrl);
                    remoteAudio.play().catch(e => console.log(e));
                }
            }
        });
    }

    listenToFirebase();
</script>

</body>
</html>
