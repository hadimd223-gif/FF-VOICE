<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Voice & Soundboard Pro</title>
    <style>
        :root {
            --bg-dark: #0f111a;
            --card-bg: #1a1d2d;
            --accent: #ff4655;
            --accent-hover: #e03a48;
            --text-main: #ffffff;
            --text-muted: #8f95b2;
            --success: #00e676;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .header h1 {
            font-size: 20px;
            letter-spacing: 1px;
            color: var(--accent);
        }

        .status-badge {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(0, 230, 118, 0.15);
            color: var(--success);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .room-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.15);
            background: #121420;
            color: white;
            outline: none;
        }

        button.primary-btn {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button.primary-btn:hover {
            background: var(--accent-hover);
        }

        .section-title {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .sound-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .sound-btn {
            background: #23273d;
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 15px 10px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .sound-btn:active {
            transform: scale(0.96);
            background: var(--accent);
        }

        .sound-btn span.icon {
            font-size: 22px;
        }

        .custom-upload {
            background: #121420;
            border: 1px dashed rgba(255,255,255,0.2);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            margin-bottom: 15px;
        }

        .custom-upload label {
            cursor: pointer;
            color: var(--text-muted);
            font-size: 13px;
            display: block;
        }

        .bg-toggle {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #121420;
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 14px;
        }

        /* Floating Mini Overlay Simulation */
        .floating-bubble {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 55px;
            height: 55px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 5px 20px rgba(255, 70, 85, 0.5);
            cursor: grab;
            z-index: 999;
            user-select: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>IS VOICE PRO</h1>
        <div class="status-badge">
            <div class="status-dot"></div>
            <span id="connStatus">Ready</span>
        </div>
    </div>

    <!-- টিমমেট কানেকশন রুম -->
    <div class="section-title">টিম রুম (রিয়েল-টাইম সিঙ্ক)</div>
    <div class="room-controls">
        <input type="text" id="roomCode" placeholder="রুম কোড দিন (যেমন: FF99)" value="FF77">
        <button class="primary-btn" onclick="joinRoom()">যুক্ত হন</button>
    </div>

    <!-- সাউন্ডবোর্ড বাটনসমূহ -->
    <div class="section-title">ভয়েস ইফেক্ট ও সাউন্ডবোর্ড</div>
    <div class="sound-grid" id="soundGrid">
        <button class="sound-btn" onclick="triggerSound('enemy', 440, 'sawtooth')">
            <span class="icon">🚨</span>
            <span>Enemy Ahead!</span>
        </button>
        <button class="sound-btn" onclick="triggerSound('help', 587, 'triangle')">
            <span class="icon">🆘</span>
            <span>Help Me!</span>
        </button>
        <button class="sound-btn" onclick="triggerSound('rush', 659, 'square')">
            <span class="icon">⚡</span>
            <span>Let's Rush!</span>
        </button>
        <button class="sound-btn" onclick="triggerSound('booyah', 880, 'sine')">
            <span class="icon">🔥</span>
            <span>Booyah!</span>
        </button>
    </div>

    <!-- কাস্টম অডিও ফাইল আপলোড -->
    <div class="custom-upload">
        <label for="audioFile">
            📁 ফোনের যেকোনো MP3/WAV সাউন্ড যোগ করুন
        </label>
        <input type="file" id="audioFile" accept="audio/*" style="display:none" onchange="loadCustomAudio(event)">
    </div>

    <!-- ব্যাকগ্রাউন্ড প্লেব্যাক মোড -->
    <div class="bg-toggle">
        <span>ব্যাকগ্রাউন্ড ওভারলে অ্যাক্টিভ রাখুন</span>
        <input type="checkbox" id="bgKeepAlive" checked onchange="toggleBackgroundAudio()">
    </div>
</div>

<!-- ফ্লোটিং বাবল -->
<div class="floating-bubble" id="floatBubble" title="ড্র্যাগ করে সরান">🎙️</div>

<script>
    // Web Audio API কনটেক্সট (ইন্টারনাল সাউন্ড জেনারেট ও প্লে করার জন্য)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let customAudioBuffer = null;
    let currentRoom = "FF77";

    // কাস্টম MP3 লোড করা
    function loadCustomAudio(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            audioCtx.decodeAudioData(e.target.result, function(buffer) {
                customAudioBuffer = buffer;
                const grid = document.getElementById('soundGrid');
                const btn = document.createElement('button');
                btn.className = 'sound-btn';
                btn.innerHTML = `<span class="icon">🎵</span><span>${file.name.substring(0, 12)}</span>`;
                btn.onclick = () => playCustomBuffer(buffer);
                grid.appendChild(btn);
            });
        };
        reader.readAsArrayBuffer(file);
    }

    function playCustomBuffer(buffer) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(audioCtx.destination);
        source.start(0);
        broadcastEvent('custom_audio');
    }

    // বিল্ট-ইন সাউন্ড ইফেক্ট প্লে করা
    function triggerSound(name, freq, type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.5, audioCtx.currentTime + 0.25);
        
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);

        // রুমের অন্য টিমমেটদের কাছে সিগন্যাল পাঠানো
        broadcastEvent(name);
    }

    // রুম কানেকশন সিস্টেম (BroadcastChannel দিয়ে লোকাল টেস্ট এবং Firebase-এর জন্য প্রস্তুত)
    let channel = new BroadcastChannel('ff_voice_room_' + currentRoom);

    function joinRoom() {
        const code = document.getElementById('roomCode').value.trim();
        if (!code) return;
        currentRoom = code;
        channel.close();
        channel = new BroadcastChannel('ff_voice_room_' + currentRoom);
        setupListener();
        document.getElementById('connStatus').innerText = `Room: ${currentRoom}`;
    }

    function broadcastEvent(soundName) {
        channel.postMessage({ type: 'PLAY_SOUND', sound: soundName, time: Date.now() });
    }

    function setupListener() {
        channel.onmessage = (event) => {
            if (event.data.type === 'PLAY_SOUND') {
                console.log("Teammate played:", event.data.sound);
                // টিমমেটের ডিভাইসে অটোমেটিক সাউন্ড প্লে হবে
                if (event.data.sound === 'enemy') triggerSoundLocal(440, 'sawtooth');
                if (event.data.sound === 'help') triggerSoundLocal(587, 'triangle');
                if (event.data.sound === 'rush') triggerSoundLocal(659, 'square');
                if (event.data.sound === 'booyah') triggerSoundLocal(880, 'sine');
            }
        };
    }

    function triggerSoundLocal(freq, type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
    }

    // ব্যাকগ্রাউন্ড স্লিপ প্রিভেনশন (সাইলেন্ট অডিও লুপ)
    function toggleBackgroundAudio() {
        const isChecked = document.getElementById('bgKeepAlive').checked;
        if (isChecked && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    // ফ্লোটিং বাবল ড্র্যাগ করার লজিক
    const bubble = document.getElementById('floatBubble');
    let isDragging = false;

    bubble.addEventListener('touchmove', (e) => {
        const touch = e.touches[0];
        bubble.style.left = (touch.clientX - 27) + 'px';
        bubble.style.top = (touch.clientY - 27) + 'px';
        bubble.style.bottom = 'auto';
        bubble.style.right = 'auto';
    });

    setupListener();
</script>

</body>
</html>
